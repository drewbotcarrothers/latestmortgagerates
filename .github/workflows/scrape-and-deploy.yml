name: Scrape Rates & Deploy

on:
  schedule:
    - cron: '0 11 * * *'  # 6 AM EST
    - cron: '0 23 * * *'  # 6 PM EST
  workflow_dispatch:

env:
  NODE_VERSION: '22'
  PYTHON_VERSION: '3.11'

jobs:
  scrape-and-deploy:
    # Home Mac runner (Canadian residential ISP IP) so BMO is reachable without
    # a paid proxy. Labels must match the registered runner (lmr-home).
    # Never add pull_request triggers — this is a public repo; a PR from a fork
    # would execute on the self-hosted machine with full repo secrets.
    runs-on: [self-hosted, macOS, lmr-home]
    # First run may brew-install python@3.11 / node@22 and download Chromium + WebKit.
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      # Step 1: Checkout
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Scrape rates
      # Do NOT use actions/setup-python (or setup-node) on this Mac.
      # setup-python@v5 hardcodes /Users/runner/hostedtoolcache on macOS
      # (non-relocatable CPython). Andrew's runner user is andrewcarrothers,
      # so `mkdir /Users/runner` fails with Permission denied. AGENT_TOOLSDIRECTORY
      # cannot override that path — the action overwrites it. Use Homebrew instead.
      - name: Setup Python 3.11 and Node 22 (Homebrew)
        run: bash .github/scripts/setup-self-hosted-macos.sh

      - name: Install Python dependencies
        working-directory: scraping
        run: |
          python -m pip install -r requirements.txt
          python -m pip install playwright
          # Do not use `install-deps` or `--with-deps` (Linux apt only; fails on macOS).
          # Chromium is used by most lenders. WebKit is the Safari-like engine for BMO
          # when curl_cffi Safari impersonation is not enough.
          python -m playwright install chromium
          python -m playwright install webkit || echo "WebKit install failed; BMO will use curl_cffi / Chromium fallback"

      - name: Run scraper
        working-directory: scraping
        env:
          # Optional fallback only. Primary BMO path is this self-hosted
          # Canadian residential IP (lmr-home). Leave proxy secrets unset
          # unless the home IP is blocked. Never commit credentials.
          SCRAPER_PROXY_URL: ${{ secrets.SCRAPER_PROXY_URL }}
          SCRAPER_PROXY_USERNAME: ${{ secrets.SCRAPER_PROXY_USERNAME }}
          SCRAPER_PROXY_PASSWORD: ${{ secrets.SCRAPER_PROXY_PASSWORD }}
          HTTPS_PROXY: ${{ secrets.HTTPS_PROXY }}
          HTTP_PROXY: ${{ secrets.HTTP_PROXY }}
          BRIGHTDATA_PROXY_URL: ${{ secrets.BRIGHTDATA_PROXY_URL }}
          OXYLABS_PROXY_URL: ${{ secrets.OXYLABS_PROXY_URL }}
          SMARTPROXY_URL: ${{ secrets.SMARTPROXY_URL }}
        run: python test_all_lenders_v2.py

      # Step 3.4: Deduplicate and validate rates
      - name: Clean and deduplicate rates
        working-directory: scraping
        run: |
          python -m pip install loguru pydantic
          python clean_and_save.py ../data/rates.json ../data/rates.json
          echo "Rate cleaning complete"

      # Step 3.5: Update historical rates for trend analysis
      - name: Update historical rates
        working-directory: scraping/src
        run: |
          python -m pip install loguru
          python historical_rates.py

      # Step 3: Commit data changes FIRST (before email)
      - name: Commit and push data
        run: |
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"

          # Stage all changes including any temp files
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          COMMIT_MSG="🤖 Auto-update rates: $(date +'%Y-%m-%d %H:%M UTC')"

          # Commit locally, then try to push with automatic retry on race
          git commit -m "$COMMIT_MSG"

          for i in 1 2 3; do
            if git push origin master; then
              echo "✅ Push succeeded on attempt $i"
              exit 0
            fi

            echo "⚠️ Push failed (attempt $i), pulling and rebasing..."
            # Check if there are local changes before stashing
            if ! git diff --quiet; then
              git stash push -m "workflow-temp-$i"
              STASHED=true
            else
              STASHED=false
            fi
            
            if git pull --rebase origin master; then
              if [ "$STASHED" = "true" ]; then
                git stash pop
              fi
              echo "Rebased, retrying push..."
            else
              echo "❌ Rebase failed, aborting"
              if [ "$STASHED" = "true" ]; then
                git stash pop 2>/dev/null || true
              fi
              git rebase --abort 2>/dev/null || true
              exit 1
            fi
          done

          echo "❌ Failed to push after 3 attempts"
          exit 1

      # Step 3.6: Generate email summary (after commit to avoid race)
      - name: Generate email summary
        id: email_summary
        run: |
          python -m pip install loguru
          python scripts/generate_email_summary.py

      # Step 3.7: Send email notification via Hostinger SMTP
      - name: Send email notification
        if: ${{ steps.email_summary.outcome == 'success' }}
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_HOST }}
          server_port: 465
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          secure: true
          subject: "📊 Rate Scraper Report - $(date +'%Y-%m-%d %H:%M UTC')"
          to: acarrothers@gmail.com
          from: "Rate Scraper Bot <${{ secrets.SMTP_USERNAME }}>"
          html_body: file://email_summary.html
          convert_markdown: false
          attachments: data/metadata.json,data/rates.json

      # Step 3: Build website (Node 22 already on PATH from Homebrew setup)
      - name: Install dependencies
        run: npm ci

      # Sitemap is generated by @astrojs/sitemap during `npm run build`
      # (trailing-slash canonical URLs). Do not write public/sitemap.xml
      # before the build — that used to omit slashes and override Astro's file.

      - name: Build Astro site
        run: npm run build

      - name: Create build info
        run: |
          mkdir -p dist
          echo "Build timestamp: $(date +%s)" > dist/build-info.txt
          echo "Rates: $(python3 -c "import json; print(len(json.load(open('data/rates.json'))))" 2>/dev/null || echo "unknown")" >> dist/build-info.txt
          cp data/rates.json dist/
          cp data/metadata.json dist/
          cat dist/build-info.txt

      # Step 5: Deploy to Hostinger via FTP (retry only if attempt 1 fails).
      # Attempt 1 uses continue-on-error so a transient FTP blip can be retried;
      # GitHub still marks that step with a check. The wait + attempt 2 steps
      # are skipped when attempt 1 succeeds (outcome == success).
      # Do not enable dangerous-clean-slate — it would wipe public_html extras
      # (PHP, Hostinger files). API JSON is emitted as flat files so FTP can
      # overwrite Next.js leftover file api/version and update api/rates/.
      - name: Deploy to Hostinger (FTP - Attempt 1)
        id: deploy1
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./
          timeout: 120000
        continue-on-error: true

      - name: FTP attempt 1 status
        run: |
          echo "FTP attempt 1 outcome: ${{ steps.deploy1.outcome }}"
          if [ "${{ steps.deploy1.outcome }}" = "success" ]; then
            echo "FTP succeeded; skipping retry."
          else
            echo "FTP attempt 1 failed; waiting 2 minutes before retry."
          fi

      - name: Wait 2 minutes before retry
        if: steps.deploy1.outcome == 'failure'
        run: sleep 120

      - name: Deploy to Hostinger (FTP - Attempt 2)
        if: steps.deploy1.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.SFTP_HOST }}
          username: ${{ secrets.SFTP_USERNAME }}
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21
          protocol: ftp
          local-dir: ./dist/
          server-dir: ./
          timeout: 120000
